# Builds the library and the launcher app on every push, and publishes the zip
# as a release when a tag starting with "v" is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from git describe

      - name: Build
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: warband-metal
          path: build/warband-metal-*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/warband-metal-*.zip
          generate_release_notes: true
